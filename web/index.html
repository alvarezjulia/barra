<title>Barra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow phone column; day strip on top, the day's blocks, ask, history. */
:root{
  --bg:#eef0f3; --surface:#ffffff; --ink:#15181d; --muted:#5d6672; --line:#d6dbe2;
  --accent:#c8322b; --accent-ink:#ffffff; --chip:#e2e6ec; --good:#2e8b4f;
  --bar:#9aa3ad; --plate-edge:rgba(0,0,0,.25);
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"Barlow",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111419; --surface:#1a1e25; --ink:#e9ecf0; --muted:#98a2ae; --line:#2b313a;
  --accent:#e5534b; --accent-ink:#ffffff; --chip:#252b34; --good:#4fbf78;
  --bar:#6c7681; --plate-edge:rgba(255,255,255,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111419; --surface:#1a1e25; --ink:#e9ecf0; --muted:#98a2ae; --line:#2b313a;
  --accent:#e5534b; --accent-ink:#ffffff; --chip:#252b34; --good:#4fbf78;
  --bar:#6c7681; --plate-edge:rgba(255,255,255,.3); color-scheme:dark}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body)}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:28px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:2.2rem;line-height:1;font-weight:700}
h2{font-size:1.5rem;font-weight:600}
.eyebrow{font:600 .75rem/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
header{display:flex;flex-direction:column;gap:6px}
header p{margin:0;font-size:.9rem}

.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.day{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;
  padding:8px 10px;min-width:64px;text-align:left;cursor:pointer;font:inherit;display:flex;flex-direction:column;gap:2px}
.day .d{font:600 .7rem/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.day .n{font:600 1.05rem/1.1 var(--display)}
.day.past{opacity:.55}
.day.today .d{color:var(--accent)}
.day[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);opacity:1}
.day[aria-pressed="true"] .d{color:inherit}
.day:focus-visible,button:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.session{display:flex;flex-direction:column;gap:14px}
.session-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.block{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.block-head{display:flex;gap:12px;align-items:baseline}
.letter{font:700 1.6rem/1 var(--display);color:var(--accent)}
.block-head h3{font-size:1.35rem;font-weight:600;line-height:1.1}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.pill{background:var(--chip);border-radius:999px;padding:2px 10px;font-size:.8rem;color:var(--ink)}
.pill.warn{background:transparent;border:1px solid var(--accent);color:var(--accent)}
.note{font-size:.9rem;border-left:3px solid var(--accent);padding-left:10px}

.sets{display:flex;flex-direction:column;gap:10px}
.set{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center}
.set .kg{font:700 2rem/1 var(--display);font-variant-numeric:tabular-nums;min-width:4.2ch}
.set .kg small{font-size:.9rem;font-weight:500;color:var(--muted);margin-left:2px}
.set .what{font-size:.9rem;color:var(--muted)}
.set .what b{color:var(--ink);font-weight:600}
.set .plates{grid-column:1 / -1}
.loadout{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sleeve{display:flex;align-items:center;height:44px}
.sleeve .collar{width:6px;height:16px;background:var(--bar);border-radius:2px}
.sleeve .shaft{width:26px;height:6px;background:var(--bar)}
.plate{width:11px;border-radius:2px;border:1px solid var(--plate-edge);margin-right:1px}
.plist{font-size:.85rem;color:var(--muted)}
.rmline{font-size:.85rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:2px}
.rmline b{color:var(--ink)}

.ask{display:flex;flex-direction:column;gap:10px}
.ask form{display:flex;gap:8px}
.ask textarea{flex:1;min-width:0;resize:vertical;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;background:var(--surface);color:var(--ink)}
.btn{border:0;border-radius:10px;padding:0 16px;background:var(--accent);color:var(--accent-ink);font:600 1rem var(--body);cursor:pointer;min-height:44px}
.btn[disabled]{opacity:.5;cursor:default}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 12px;font:inherit;font-size:.85rem;cursor:pointer}
.log{display:flex;flex-direction:column;gap:10px}
.msg{padding:10px 12px;border-radius:10px;white-space:pre-wrap;font-size:.95rem;min-width:0;overflow-wrap:anywhere}
.msg.me{background:var(--chip);align-self:flex-end;max-width:85%}
.msg.ai{background:var(--surface);border:1px solid var(--line)}

.hist{display:flex;flex-direction:column;gap:12px}
.hist select{font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);max-width:100%}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--muted);padding:4px 8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 .72rem/1.2 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td.num{white-space:nowrap}
.pr{color:var(--good);font-weight:600;font-size:.75rem}
.recent{display:flex;flex-direction:column;gap:12px}
.recent article{display:flex;flex-direction:column;gap:4px;font-size:.9rem}
.recent h3{font-size:1.05rem}
.empty{padding:24px;text-align:center;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header>
    <span class="eyebrow" id="eyebrow">Weightlifting</span>
    <h1 id="title">Barra</h1>
    <p class="muted" id="freshness">Loading the week…</p>
  </header>

  <nav class="days" id="days" aria-label="Days of the week"></nav>

  <section class="session" id="session" aria-live="polite">
    <div class="empty">Loading today's workout…</div>
  </section>

  <section class="ask" id="ask" hidden>
    <h2>Ask</h2>
    <div class="quick" id="quick">
      <button type="button" data-q="What weight do I lift today in each block, and which plates do I load?">Today's weights</button>
      <button type="button" data-q="I feel tired today. How much would you drop the weights?">I'm tired</button>
      <button type="button" data-q="How am I progressing on my main lifts?">My progression</button>
    </div>
    <div class="log" id="log"></div>
    <form id="askform">
      <label for="q" hidden>Your question</label>
      <textarea id="q" rows="1" placeholder="Ask about your weights, the week or your progression"></textarea>
      <button class="btn" id="send" type="submit">Ask</button>
    </form>
  </section>

  <section class="hist">
    <h2>History</h2>
    <label for="mov" class="eyebrow">Lift</label>
    <select id="mov"></select>
    <div class="chart" id="chart"></div>
    <div class="tablewrap"><table id="histtable"></table></div>
  </section>

  <section class="recent">
    <h2>Recent workouts</h2>
    <div id="recent"></div>
  </section>
</div>

<script>
const PLATE = {25:'#c8322b',20:'#2b60c8',15:'#e0b41f',10:'#2e9e4f',5:'#f2f2f2',2.5:'#c8322b',2:'#2b60c8',1.5:'#e0b41f',1.25:'#d97a1f',1:'#2e9e4f',0.5:'#f2f2f2'};
const PLATE_H = w => w >= 10 ? 44 : w >= 5 ? 32 : w >= 2 ? 24 : 18;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtNum = n => n == null ? '—' : Number(n).toLocaleString(undefined, {maximumFractionDigits: 2});
const fmtKg = fmtNum;
const today = (() => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; })();
const parseD = s => new Date(s + 'T12:00:00');
const longDate = s => parseD(s).toLocaleDateString(undefined, {weekday:'long', day:'numeric', month:'long'});
const shortDay = dt => dt.toLocaleDateString(undefined, {weekday:'short'}) + ' ' + dt.getDate();

let DATA = null, current = null;

function cadence(c){
  if(!c) return null;
  if(c.type === 'emom' && c.seconds){ const m = Math.floor(c.seconds/60), s = c.seconds%60; return `every ${m}:${String(s).padStart(2,'0')}`; }
  if(c.type === 'as_needed') return 'rest as needed';
  return null;
}

// Consecutive identical sets are grouped: "4 × 1 @ 85%".
function group(sets){
  const out = [];
  for(const s of sets){
    const k = `${s.pct}|${s.reps}|${s.load && s.load.kg}`;
    const last = out[out.length-1];
    if(last && last.k === k) last.n++; else out.push({k, n:1, s});
  }
  return out;
}

function barbell(platesPerSide){
  const plates = platesPerSide.flatMap(p => Array(p.n).fill(p.w));
  return `<div class="sleeve" aria-hidden="true"><div class="shaft"></div><div class="collar"></div>${
    plates.map(w => `<div class="plate" style="height:${PLATE_H(w)}px;background:${PLATE[w]||'var(--bar)'}"></div>`).join('')
  }<div class="collar"></div></div>`;
}

function renderDays(){
  const nav = $('days');
  nav.innerHTML = DATA.days.map(d => {
    const dt = parseD(d.date);
    const cls = ['day', d.date < today ? 'past' : '', d.date === today ? 'today' : ''].join(' ');
    return `<button type="button" class="${cls}" data-date="${d.date}" aria-pressed="${d.date===current}">
      <span class="d">${d.date===today ? 'today' : esc(shortDay(dt))}</span>
      <span class="n">${esc(d.name)}</span></button>`;
  }).join('');
  nav.querySelectorAll('.day').forEach(b => b.onclick = () => { current = b.dataset.date; renderDays(); renderSession(); });
  const sel = nav.querySelector('[aria-pressed="true"]');
  if(sel) sel.scrollIntoView({block:'nearest', inline:'center'});
}

function renderSession(){
  const d = DATA.days.find(x => x.date === current);
  const el = $('session');
  if(!d){ el.innerHTML = '<div class="empty">No workout programmed that day.</div>'; return; }
  el.innerHTML = `<div class="session-head"><h2>${esc(d.name)}</h2><span class="eyebrow">${esc(longDate(d.date))}</span></div>` +
    d.blocks.map(b => {
      const pills = [cadence(b.cadence), `${b.sets.length} ${b.sets.length===1?'set':'sets'}`].filter(Boolean)
        .map(t => `<span class="pill">${esc(t)}</span>`);
      if(b.rm && b.rm.source === 'approx') pills.push('<span class="pill warn">approximate RM</span>');
      const sets = group(b.sets).map(g => {
        const s = g.s, c = s.load;
        const what = `<b>${g.n} × ${s.reps ?? '?'}</b>${s.pct != null ? ` @ ${fmtNum(s.pct)}%` : ''}`;
        if(!c) return `<div class="set"><div class="kg">—</div><div class="what">${what}${s.pct!=null?' · no RM, not calculated':''}</div></div>`;
        if(c.kg == null) return `<div class="set"><div class="kg">—</div><div class="what">${what} · ${esc(c.warning)}</div></div>`;
        const plist = c.plates.length ? c.plates.map(p => (p.n>1?`${p.n}×`:'') + fmtKg(p.w)).join(' + ') + ' per side' : 'just the bar';
        return `<div class="set"><div class="kg">${fmtKg(c.kg)}<small>kg</small></div>
          <div class="what">${what} · target ${fmtKg(c.target)}</div>
          <div class="plates loadout">${barbell(c.plates)}<span class="plist">${plist}</span></div></div>`;
      }).join('');
      const rm = b.rm ? `<span>RM <b class="num">${fmtKg(b.rm.kg)} kg</b> · ${esc(b.rm.detail)}</span>` : (b.sets.some(s=>s.pct!=null) ? '<span>No RM for this lift: no weight is made up.</span>' : '');
      const last = b.last ? `<span>Last time (${esc(b.last.date)}): ${esc(b.last.done)}${b.last.programmed?` at ${esc(b.last.programmed)}`:''}</span>` : '';
      return `<article class="block">
        <div class="block-head"><span class="letter">${esc(b.label)}</span><h3>${esc(b.name)}</h3></div>
        <div class="meta">${pills.join('')}</div>
        ${b.notes ? `<div class="note">${esc(b.notes)}</div>` : ''}
        <div class="sets">${sets}</div>
        ${(rm||last) ? `<div class="rmline">${rm}${last}</div>` : ''}
      </article>`;
    }).join('');
}

function renderHist(){
  const sel = $('mov');
  sel.innerHTML = DATA.lifts.map((m,i) => `<option value="${i}">${esc(m.name)} (${m.sessions.length})</option>`).join('');
  sel.onchange = () => drawLift(DATA.lifts[+sel.value]);
  drawLift(DATA.lifts[0]);
}

function drawLift(m){
  const pts = m.sessions.filter(s => s.rm || s.top);
  const W = 640, H = 240, L = 40, R = 14, T = 14, B = 28;
  const xs = pts.map(s => parseD(s.date).getTime());
  const ys = pts.flatMap(s => [s.rm, s.top]).filter(v => v != null);
  const x0 = Math.min(...xs), x1 = Math.max(...xs) || x0 + 1;
  let y0 = Math.floor((Math.min(...ys) - 3) / 5) * 5, y1 = Math.ceil((Math.max(...ys) + 3) / 5) * 5;
  const X = t => L + (x1===x0 ? (W-L-R)/2 : (t - x0) / (x1 - x0) * (W - L - R));
  const Y = v => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
  const step = (y1 - y0) > 40 ? 10 : 5;
  let g = '';
  for(let v = y0; v <= y1; v += step) g += `<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`;
  const months = new Map();
  pts.forEach(s => { const k = s.date.slice(0,7); if(!months.has(k)) months.set(k, s.date); });
  for(const [, f] of months){ const t = parseD(f); g += `<text x="${X(t.getTime())}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(t.toLocaleDateString(undefined,{month:'short'}))}</text>`; }
  const rmPts = pts.filter(s => s.rm);
  const line = rmPts.map((s,i) => `${i?'L':'M'}${X(parseD(s.date).getTime()).toFixed(1)},${Y(s.rm).toFixed(1)}`).join(' ');
  const area = rmPts.length ? `${line} L${X(parseD(rmPts[rmPts.length-1].date).getTime()).toFixed(1)},${H-B} L${X(parseD(rmPts[0].date).getTime()).toFixed(1)},${H-B} Z` : '';
  const tops = pts.filter(s => s.top).map(s => `<circle cx="${X(parseD(s.date).getTime())}" cy="${Y(s.top)}" r="3.5" fill="var(--muted)" opacity=".7"><title>${s.date}: ${s.top} kg</title></circle>`).join('');
  const last = rmPts[rmPts.length-1];
  const end = last ? `<circle cx="${X(parseD(last.date).getTime())}" cy="${Y(last.rm)}" r="5" fill="var(--accent)"/><text x="${Math.min(X(parseD(last.date).getTime()), W-R-4)}" y="${Y(last.rm)-10}" text-anchor="end" font-size="12" font-weight="600" fill="var(--ink)">${fmtKg(last.rm)}</text>` : '';
  $('chart').innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Implied RM for ${esc(m.name)} over time">${g}
    <path d="${area}" fill="var(--accent)" opacity=".08"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>${tops}${end}</svg>
    <div class="legend"><span><i style="background:var(--accent)"></i>implied RM (kg ÷ %)</span><span><i style="background:var(--muted)"></i>heaviest set</span></div>`;
  $('histtable').innerHTML = `<thead><tr><th>Date</th><th>Programmed</th><th>Done</th><th>Impl. RM</th></tr></thead><tbody>${
    [...m.sessions].reverse().map(s => `<tr><td class="num">${esc(s.date)}</td><td>${esc(s.programmed||'—')}</td><td>${esc(s.done)}${s.pr?' <span class="pr">PR</span>':''}</td><td class="num">${s.rm!=null?fmtKg(s.rm):'—'}</td></tr>`).join('')
  }</tbody>`;
}

function renderRecent(){
  $('recent').innerHTML = DATA.recent.slice(0,6).map(d => `<article><h3>${esc(longDate(d.date))}</h3>${
    d.blocks.map(b => `<div><b>${esc(b.label)}.</b> ${esc(b.name)} · <span class="muted">${b.programmed?esc(b.programmed)+' → ':''}</span>${esc(b.done)}${b.pr?' <span class="pr">PR</span>':''}</div>`).join('')
  }</article>`).join('');
}

// ---------- Ask ----------
function context(){
  const week = DATA.days.map(d => `${d.date} ${d.name}\n` + d.blocks.map(b => `  ${b.label}. ${b.name} [${cadence(b.cadence)||''}] RM ${b.rm?b.rm.kg+' kg ('+b.rm.detail+')':'no RM'}${b.notes?' · note: '+b.notes:''}\n` +
    group(b.sets).map(g => `     ${g.n}x${g.s.reps} @ ${g.s.pct ?? '-'}% -> ${g.s.load&&g.s.load.kg!=null ? g.s.load.kg+' kg ('+g.s.load.plates.map(p=>(p.n>1?p.n+'x':'')+p.w).join('+')+' per side)' : 'no weight'}`).join('\n') +
    (b.last ? `\n     last time ${b.last.date}: ${b.last.done} at ${b.last.programmed}` : '')).join('\n')).join('\n');
  const prog = DATA.lifts.map(m => `${m.name}: ` + m.sessions.slice(-6).map(s => `${s.date} ${s.programmed||'-'} ${s.done} (RM ${s.rm??'-'})`).join(' | ')).join('\n');
  return `You are the weightlifting assistant of ${DATA.athlete || 'the athlete'}. Answer in the same language the user writes in; be brief and concrete, with kilos.
Today is ${today}. ${DATA.bar} kg bar. Plates available per side: ${DATA.plates.map(p => p.w + (p.pairs > 1 ? `(x${p.pairs})` : '')).join(', ')}.
The coach programs in % of 1RM. The kilos below are already calculated; each block says which RM they come from (a PR, or the implied RM from the athlete's history: kg lifted ÷ % programmed).
Use these numbers; do not invent RMs. If something is not in the data, say so.

PROGRAMMED WEEK (kilos calculated):
${week}

RECENT PROGRESSION BY LIFT:
${prog}`;
}

async function setupAsk(){
  const sample = await claude.use('sample');
  if(!sample) return;
  $('ask').hidden = false;
  const history = [];
  const log = $('log'), q = $('q'), send = $('send');
  let busy = false;
  async function ask(text){
    if(busy || !text.trim()) return;
    busy = true; send.disabled = true;
    history.push({role:'user', content:text});
    log.insertAdjacentHTML('beforeend', `<div class="msg me">${esc(text)}</div>`);
    const out = document.createElement('div'); out.className = 'msg ai'; out.textContent = 'Thinking…'; log.appendChild(out);
    q.value = '';
    try{
      const msgs = [{role:'user', content: context() + '\n\nQuestion: ' + history[0].content}, ...history.slice(1)];
      const r = await sample(msgs, {cache:false, onText: ({text}) => { out.textContent = text; }});
      out.textContent = r.text;
      history.push({role:'assistant', content:r.text});
    }catch(e){
      history.pop();
      out.textContent = e && e.code === 'rate_limited' ? 'Too many questions in a row. Wait a minute and try again.'
        : e && e.code === 'not_granted' ? "This page isn't allowed to ask Claude. You can grant it in the artifact's permissions menu."
        : "The answer didn't come through. Try again.";
    }
    busy = false; send.disabled = false;
  }
  $('askform').addEventListener('submit', e => { e.preventDefault(); ask(q.value); });
  q.addEventListener('keydown', e => { if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); ask(q.value); } });
  $('quick').querySelectorAll('button').forEach(b => b.onclick = () => ask(b.dataset.q));
}

async function boot(){
  try{
    DATA = await (await fetch('data.json')).json();
  }catch(e){
    $('session').innerHTML = "<div class=\"empty\">Couldn't load the week's data.</div>";
    $('freshness').textContent = '';
    return;
  }
  const dates = DATA.days.map(d => d.date);
  current = dates.includes(today) ? today : (dates.find(d => d > today) || dates[dates.length-1]);
  if(DATA.athlete) $('title').textContent = `Barra · ${DATA.athlete}`;
  $('eyebrow').textContent = `Weightlifting · ${fmtKg(DATA.bar)} kg bar`;
  const gen = new Date(DATA.generated);
  $('freshness').textContent = `WodUp data from ${gen.toLocaleDateString(undefined,{day:'numeric',month:'long'})}. Last logged workout: ${longDate(DATA.lastWorkout)}.`;
  renderDays(); renderSession(); renderHist(); renderRecent();
  if(window.claude && claude.use) setupAsk();
}
boot();
</script>
